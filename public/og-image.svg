<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <radialGradient id="glow" cx="18%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <text x="80" y="118" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="800" fill="#34d399">ReWork</text>

  <text font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="62" font-weight="800" fill="#ffffff">
    <tspan x="80" y="232">Tailor your resume to any job</tspan>
    <tspan x="80" y="308">in under a minute.</tspan>
    <tspan x="80" y="384" fill="#34d399">Nothing made up.</tspan>
  </text>

  <text x="80" y="456" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="28" fill="#cbd5e1">Every rewrite is checked against your real resume.</text>

  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="24" fill="#e2e8f0">
    <rect x="80" y="506" width="232" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="196" y="540" text-anchor="middle">Upload resume</text>
    <rect x="328" y="506" width="232" height="52" rx="26" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="444" y="540" text-anchor="middle">Paste job link</text>
    <rect x="576" y="506" width="340" height="52" rx="26" fill="#10b981" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.5"/>
    <text x="746" y="540" text-anchor="middle" fill="#a7f3d0">Resume + cover letter</text>
  </g>

  <text x="1120" y="590" text-anchor="end" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#64748b">3 free tailors a month · no card</text>
</svg>
